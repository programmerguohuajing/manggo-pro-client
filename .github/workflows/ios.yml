name: iOS Build

# iOS 出包完全可以在 GitHub Actions 上完成：
#   - GitHub 提供真实的 macOS runner（Apple Silicon），Xcode / CocoaPods 预装
#   - 未签名 IPA：零配置，push 即可出包（用于重签 / 内部验证）
#   - 已签名 IPA：配好 4 个 Secrets 后可出 ad-hoc / App Store 包，甚至直传 TestFlight
# 详见 mobile/docs/ios-ci.md

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: '导出方式（unsigned 不需要任何证书）'
        type: choice
        default: unsigned
        options:
          - unsigned
          - ad-hoc
          - development
          - app-store
      upload_testflight:
        description: '上传 TestFlight（需 ASC API Key，仅 app-store 生效）'
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
    # 只认真正影响 iOS 产物的路径，改 README / android 配置不再触发 macOS 构建
    paths:
      - 'mobile/lib/**'
      - 'mobile/ios/**'
      - 'mobile/test/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'mobile/lib/**'
      - 'mobile/ios/**'
      - 'mobile/test/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与你本地 Flutter SDK 保持一致；若该版本在官方 release 列表不可用，
  # 改成 channel 最新版即可（把下面改成 'stable' 并删除 flutter-version 行）
  FLUTTER_VERSION: '3.47.9'
  APP_DIR: mobile

jobs:
  # ---------------------------------------------------------------------------
  # 探测签名 Secrets 是否齐备，决定是否跑签名构建
  # ---------------------------------------------------------------------------
  detect-signing:
    name: Detect signing secrets
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Detect
        id: detect
        env:
          CERT: ${{ secrets.IOS_CERT_P12 }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "签名 Secrets 齐备，将执行签名构建"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过签名构建::未配置 IOS_CERT_P12 / IOS_PROVISION_PROFILE / IOS_TEAM_ID，仅产出未签名 IPA"
          fi

  # ---------------------------------------------------------------------------
  # 未签名 IPA：不需要 Apple 开发者账号，用于自签分发 / 快速验证
  # ---------------------------------------------------------------------------
  build-unsigned:
    name: Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 50
    outputs:
      version_name: ${{ steps.ver.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Toolchain info
        run: |
          sw_vers
          flutter --version
          xcodebuild -version

      - name: Xcode targets
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          # 手工改过 project.pbxproj，这一步能第一时间暴露工程文件是否有问题
          xcodebuild -list -project Runner.xcodeproj

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Resolve version
        id: ver
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)"
          [ -n "$VERSION_NAME" ] || VERSION_NAME="0.0.0"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          # 注意：macOS runner 上是 bash 3.2，非 ASCII 字符紧跟 $VAR 时会被当成变量名的一部分
          # （报 unbound variable），所以中文前后一律用 ${VAR} 包起来
          echo "version: ${VERSION_NAME}, build: ${GITHUB_RUN_NUMBER}"

      - name: Pod install (only if Podfile exists)
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "无 Podfile（当前依赖均为纯 Dart），跳过 CocoaPods"
          fi

      - name: Build iOS (no codesign)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          # --build-number 用 run_number 覆盖 pubspec 里的 +1，
          # 和 Android 的 versionCode 对齐，否则每次构建 CFBundleVersion 都是 1，
          # ad-hoc / TestFlight 会因为「构建号没涨」被拒
          flutter build ios --release --no-codesign --build-number="${GITHUB_RUN_NUMBER}"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            build/ios/iphoneos/Runner.app/Info.plist

      - name: Package unsigned IPA
        id: pkg
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "::error::未找到 $APP"
            find build/ios -maxdepth 3 -name '*.app' || true
            exit 1
          fi
          OUT="build/ipa-unsigned"
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/"

          # 键盘扩展必须真的被打进 App，否则「三连空格翻译」在设备上根本不存在
          APPEX="$APP/PlugIns/ManggoKeyboard.appex"
          if [ ! -d "$APPEX" ]; then
            echo "::error::键盘扩展没有被打包：缺少 $APPEX"
            ls "$APP/PlugIns" 2>/dev/null || echo "（连 PlugIns 目录都没有）"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist"

          NAME="ManggoPro-${{ steps.ver.outputs.version_name }}-${GITHUB_RUN_NUMBER}-ios-unsigned.ipa"
          ( cd "$OUT" && zip -qry "$NAME" Payload )
          ls -lh "$OUT"
          echo "ipa_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "UNSIGNED_IPA=$OUT/$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ env.APP_DIR }}/build/ipa-unsigned/*.ipa
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 发布到 Release：有签名包就发签名包，没有就发未签名包
  # tag 固定 ios-latest，覆盖式发布（先删再建），不会堆积 tag
  # ---------------------------------------------------------------------------
  publish:
    name: Publish iOS package
    needs: [build-unsigned, build-signed]
    if: >-
      always() && !cancelled() &&
      needs.build-unsigned.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: dl-unsigned

      - name: Download signed IPA
        if: needs.build-signed.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-signed-ipa
          path: dl-signed

      - name: Build version.json
        env:
          VERSION_NAME: ${{ needs.build-unsigned.outputs.version_name }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.manggo.manggoPro' }}
          COMMIT_NOTE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if ls dl-signed/*.ipa >/dev/null 2>&1; then
            SRC="$(ls dl-signed/*.ipa | head -1)"
            SIGNED=true; SUFFIX=signed
          else
            SRC="$(ls dl-unsigned/*.ipa | head -1)"
            SIGNED=false; SUFFIX=unsigned
          fi
          NAME="ManggoPro-${VERSION_NAME}-${GITHUB_RUN_NUMBER}-ios-${SUFFIX}.ipa"
          cp "$SRC" "dist/$NAME"
          SIZE="$(stat -c%s "dist/$NAME")"
          SHA="$(sha256sum "dist/$NAME" | awk '{print $1}')"
          NOTE="${COMMIT_NOTE:-手动触发的构建}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest/${NAME}"

          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          echo "IPA_SIGNED=$SIGNED" >> "$GITHUB_ENV"

          jq -n \
            --arg platform ios \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$GITHUB_RUN_NUMBER" \
            --arg bundleId "$BUNDLE_ID" \
            --arg ipaName "$NAME" \
            --arg ipaUrl "$URL" \
            --argjson size "$SIZE" \
            --arg sha256 "$SHA" \
            --argjson signed "$SIGNED" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$NOTE" \
            '{platform: $platform, versionName: $versionName, versionCode: $versionCode,
              bundleId: $bundleId, ipaName: $ipaName, ipaUrl: $ipaUrl, size: $size,
              sha256: $sha256, signed: $signed, publishedAt: $publishedAt, notes: $notes}' \
            > dist/version.json
          cat dist/version.json
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build-unsigned.outputs.version_name }}
        run: |
          set -euo pipefail
          gh release delete ios-latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

          MIRROR="https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest"
          if [ "$IPA_SIGNED" = "true" ]; then
            TITLE="iOS $VERSION_NAME ($GITHUB_RUN_NUMBER) 已签名"
            cat > body.md <<EOF
          已签名 IPA，装到已注册 UDID 的设备或用 TestFlight 分发。

          **文件：** \`$IPA_NAME\`
          **校验：** 见 \`version.json\` 里的 size / sha256 字段
          EOF
          else
            TITLE="iOS $VERSION_NAME ($GITHUB_RUN_NUMBER) 未签名"
            cat > body.md <<EOF
          **这是未签名 IPA，iPhone / iPad 不能直接点击安装，必须先重签。**

          - Windows：用 Sideloadly 导入本 IPA，填自己的 Apple ID 重签后装到设备（免费账号签名 7 天有效，到期重签即可）
          - macOS：Xcode → Window → Devices and Simulators，把 Runner.app 拖到设备上
          - 已越狱设备：可直接安装

          **文件：** \`$IPA_NAME\`

          **直链：**
          https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest/$IPA_NAME

          **国内加速镜像（GitHub 慢就用这个）：**
          $MIRROR/$IPA_NAME

          配好 iOS 签名 Secrets 后，这里会自动改成已签名包，步骤见 \`mobile/docs/ios-ci.md\`。
          EOF
          fi

          gh release create ios-latest -R "$GITHUB_REPOSITORY" dist/*.ipa dist/version.json \
            --title "$TITLE" \
            --prerelease \
            --notes-file body.md
          gh release view ios-latest -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'

  # ---------------------------------------------------------------------------
  # 已签名 IPA：需证书 p12 + mobileprovision + Team ID
  # ---------------------------------------------------------------------------
  build-signed:
    name: Signed IPA
    needs: detect-signing
    if: >-
      needs.detect-signing.outputs.enabled == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.export_method != 'unsigned')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPORT_METHOD: ${{ inputs.export_method || 'ad-hoc' }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.manggo.manggoPro' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Import certificate and provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          printf '%s' "$CERT_P12_BASE64" | openssl base64 -d -A -out "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A -out "$PROFILE_PATH"

          # 遍历所有 profile：Xcode 是按 UUID 文件名识别的，必须用 profile 自身 UUID 命名
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$(security default-keychain -d user | tr -d '"')"

          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PLIST"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "已导入证书，Provisioning Profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Generate ExportOptions.plist
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          XCODE_MAJOR="$(xcodebuild -version | head -1 | sed 's/Xcode //' | cut -d. -f1)"
          METHOD="$EXPORT_METHOD"
          # Xcode 16 起 app-store 改名为 app-store-connect
          if [ "$METHOD" = "app-store" ] && [ "$XCODE_MAJOR" -ge 16 ] 2>/dev/null; then
            METHOD="app-store-connect"
          fi
          echo "EXPORT_METHOD_RESOLVED=$METHOD" >> "$GITHUB_ENV"

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$METHOD</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          cat ios/ExportOptions.plist

      - name: Pod install (only if Podfile exists)
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "无 Podfile，跳过 CocoaPods"
          fi

      - name: Archive
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates
          ls -lh "$RUNNER_TEMP/export"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          mkdir -p build/ipa-signed
          cp "$IPA" "build/ipa-signed/ManggoPro-${EXPORT_METHOD}-${GITHUB_RUN_NUMBER}.ipa"
          echo "SIGNED_IPA=build/ipa-signed/ManggoPro-${EXPORT_METHOD}-${GITHUB_RUN_NUMBER}.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: ${{ env.APP_DIR }}/build/ipa-signed/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.upload_testflight == true &&
          inputs.export_method == 'app-store'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::warning::未配置 ASC_API_KEY，跳过 TestFlight 上传"
            exit 0
          fi
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            -f "$APP_DIR/$SIGNED_IPA" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
