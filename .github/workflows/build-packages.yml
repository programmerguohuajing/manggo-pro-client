name: Build packages

# 触发：推到 build/packages 分支即构建；也可手动 Run workflow。
# 每平台出两份产物：便携包 + 系统安装器（Windows Inno Setup 安装器、
# macOS DMG、Linux deb），详见 packaging/README.md。
# macOS 产物未签名，首次打开需右键 -> 打开。
# 版本号唯一来源：packaging/VERSION，安装器文件名和元数据都读它。
# 推 vX.Y.Z 标签时，publish-release job 会把全部产物发成 GitHub
# Release（程序内“检查更新”就查这个）；标签必须与 VERSION 一致，
# 不一致直接失败，防止发错版本。
on:
  push:
    branches: [build/packages]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      # 注意：不要在这里装 UPX。spec 已在 Windows 上关掉 strip/UPX，
      # 因为 UPX 后的 python312.dll 在用户真机上 LoadLibrary 失败
      # （见 spec 注释），装 UPX 只会让问题回来。
      - name: Build with PyInstaller
        run: pyinstaller manggo-pro-client.spec
      - name: Prune dead weight
        run: python packaging/prune.py dist/ManggoProClient
      - name: Pack
        run: Compress-Archive -Path dist/ManggoProClient -DestinationPath ManggoProClient-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-Windows-x64
          path: ManggoProClient-Windows-x64.zip
          retention-days: 30
      # 安装器：Inno Setup 6（windows-latest 自带 iscc，取不到时走默认安装路径）。
      - name: Build installer (Inno Setup)
        run: |
          $version = (Get-Content packaging/VERSION -Raw).Trim()
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc packaging/installer.iss /DAppVersion=$version /DSourceDir=dist\ManggoProClient /Oinstaller-out
          Get-ChildItem installer-out
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-Windows-x64-Setup
          path: installer-out/ManggoProClient-Setup.exe
          retention-days: 30

  macos-intel:
    name: macOS Intel (x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Generate .icns from app.png (best effort)
        run: |
          set +e
          mkdir -p app.iconset
          sips -z 16 16     assets/app.png --out app.iconset/icon_16x16.png
          sips -z 32 32     assets/app.png --out app.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/app.png --out app.iconset/icon_32x32.png
          sips -z 64 64     assets/app.png --out app.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/app.png --out app.iconset/icon_128x128.png
          sips -z 256 256   assets/app.png --out app.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/app.png --out app.iconset/icon_256x256.png
          sips -z 512 512   assets/app.png --out app.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/app.png --out app.iconset/icon_512x512.png
          sips -z 1024 1024 assets/app.png --out app.iconset/icon_512x512@2x.png
          iconutil -c icns app.iconset -o assets/app.icns
          echo "icns ready: $(ls -la assets/app.icns 2>/dev/null || echo MISSING)"
      - name: Build with PyInstaller
        run: pyinstaller manggo-pro-client.spec
      - name: Prune dead weight
        run: python packaging/prune.py dist/ManggoProClient.app
      - name: Pack
        run: |
          cd dist && zip -9 -r -y ../ManggoProClient-macOS-Intel.zip ManggoProClient.app
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-macOS-Intel
          path: ManggoProClient-macOS-Intel.zip
          retention-days: 30
      # 安装器：DMG（拖到 Applications 即安装；未签名，首次打开需右键）。
      - name: Build installer (DMG)
        run: |
          rm -rf dmg-staging && mkdir dmg-staging
          ditto dist/ManggoProClient.app dmg-staging/ManggoProClient.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Manggo Pro Client" -srcfolder dmg-staging -ov -format UDZO ManggoProClient-macOS-Intel.dmg
          ls -lh ManggoProClient-macOS-Intel.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-macOS-Intel-DMG
          path: ManggoProClient-macOS-Intel.dmg
          retention-days: 30

  macos-arm:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Generate .icns from app.png (best effort)
        run: |
          set +e
          mkdir -p app.iconset
          sips -z 16 16     assets/app.png --out app.iconset/icon_16x16.png
          sips -z 32 32     assets/app.png --out app.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/app.png --out app.iconset/icon_32x32.png
          sips -z 64 64     assets/app.png --out app.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/app.png --out app.iconset/icon_128x128.png
          sips -z 256 256   assets/app.png --out app.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/app.png --out app.iconset/icon_256x256.png
          sips -z 512 512   assets/app.png --out app.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/app.png --out app.iconset/icon_512x512.png
          sips -z 1024 1024 assets/app.png --out app.iconset/icon_512x512@2x.png
          iconutil -c icns app.iconset -o assets/app.icns
          echo "icns ready: $(ls -la assets/app.icns 2>/dev/null || echo MISSING)"
      - name: Build with PyInstaller
        run: pyinstaller manggo-pro-client.spec
      - name: Prune dead weight
        run: python packaging/prune.py dist/ManggoProClient.app
      - name: Pack
        run: |
          cd dist && zip -9 -r -y ../ManggoProClient-macOS-AppleSilicon.zip ManggoProClient.app
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-macOS-AppleSilicon
          path: ManggoProClient-macOS-AppleSilicon.zip
          retention-days: 30
      # 安装器：DMG（拖到 Applications 即安装；未签名，首次打开需右键）。
      - name: Build installer (DMG)
        run: |
          rm -rf dmg-staging && mkdir dmg-staging
          ditto dist/ManggoProClient.app dmg-staging/ManggoProClient.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Manggo Pro Client" -srcfolder dmg-staging -ov -format UDZO ManggoProClient-macOS-AppleSilicon.dmg
          ls -lh ManggoProClient-macOS-AppleSilicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-macOS-AppleSilicon-DMG
          path: ManggoProClient-macOS-AppleSilicon.dmg
          retention-days: 30

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Build with PyInstaller
        run: pyinstaller manggo-pro-client.spec
      - name: Prune dead weight
        run: python packaging/prune.py dist/ManggoProClient
      # 冒烟：offscreen 跑 15 秒，能活着就是启动没被 prune 弄坏；
      # 超时（124）算通过。只作信号，不阻塞产物上传。
      - name: Smoke test (offscreen, non-blocking)
        continue-on-error: true
        run: |
          cd dist/ManggoProClient
          QT_QPA_PLATFORM=offscreen timeout 15 ./ManggoProClient; code=$?
          if [ "$code" -eq 124 ]; then echo "smoke: still running after 15s, OK"; else echo "smoke: exited with $code"; exit $code; fi
      - name: Pack
        run: tar -I 'gzip -9' -cf ManggoProClient-Linux-x64.tar.gz -C dist ManggoProClient
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-Linux-x64
          path: ManggoProClient-Linux-x64.tar.gz
          retention-days: 30
      # 安装器：deb（装到 /usr/share，菜单图标 + /usr/bin 启动命令）。
      - name: Build installer (deb)
        run: |
          VERSION=$(cat packaging/VERSION | tr -d ' \n\r')
          python3 packaging/make-deb.py --version "$VERSION" --dist dist/ManggoProClient --out "manggo-pro-client_${VERSION}_amd64.deb"
          dpkg-deb --info "manggo-pro-client_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-Linux-x64-Deb
          path: manggo-pro-client_*_amd64.deb
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [windows, macos-intel, macos-arm, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches packaging/VERSION
        run: |
          VERSION=$(cat packaging/VERSION | tr -d ' \n\r')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then echo "tag $TAG != packaging/VERSION $VERSION"; exit 1; fi
          echo "release version OK: $VERSION"
      - uses: actions/download-artifact@v4
        with:
          pattern: ManggoProClient-*
          merge-multiple: true
          path: release-assets
      - name: Create release
        run: |
          ls -lh release-assets
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes release-assets/*
        env:
          GH_TOKEN: ${{ github.token }}
