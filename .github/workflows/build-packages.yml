name: Build packages

# 触发：推到 build/packages 分支即构建；也可手动 Run workflow。
# 产物是便携包（不是系统安装器）：Windows zip、macOS .app zip、Linux tar.gz，
# 详见 packaging/README.md。macOS 产物未签名，首次打开需右键 -> 打开。
on:
  push:
    branches: [build/packages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Build with PyInstaller
        run: pyinstaller manggo-pro-client.spec
      - name: Pack
        run: Compress-Archive -Path dist/ManggoProClient -DestinationPath ManggoProClient-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-Windows-x64
          path: ManggoProClient-Windows-x64.zip
          retention-days: 30

  macos-intel:
    name: macOS Intel (x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Generate .icns from app.png (best effort)
        run: |
          set +e
          mkdir -p app.iconset
          sips -z 16 16     assets/app.png --out app.iconset/icon_16x16.png
          sips -z 32 32     assets/app.png --out app.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/app.png --out app.iconset/icon_32x32.png
          sips -z 64 64     assets/app.png --out app.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/app.png --out app.iconset/icon_128x128.png
          sips -z 256 256   assets/app.png --out app.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/app.png --out app.iconset/icon_256x256.png
          sips -z 512 512   assets/app.png --out app.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/app.png --out app.iconset/icon_512x512.png
          sips -z 1024 1024 assets/app.png --out app.iconset/icon_512x512@2x.png
          iconutil -c icns app.iconset -o assets/app.icns
          echo "icns ready: $(ls -la assets/app.icns 2>/dev/null || echo MISSING)"
      - name: Build with PyInstaller
        run: pyinstaller manggo-pro-client.spec
      - name: Pack
        run: |
          cd dist && zip -r -y ../ManggoProClient-macOS-Intel.zip ManggoProClient.app
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-macOS-Intel
          path: ManggoProClient-macOS-Intel.zip
          retention-days: 30

  macos-arm:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Generate .icns from app.png (best effort)
        run: |
          set +e
          mkdir -p app.iconset
          sips -z 16 16     assets/app.png --out app.iconset/icon_16x16.png
          sips -z 32 32     assets/app.png --out app.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/app.png --out app.iconset/icon_32x32.png
          sips -z 64 64     assets/app.png --out app.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/app.png --out app.iconset/icon_128x128.png
          sips -z 256 256   assets/app.png --out app.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/app.png --out app.iconset/icon_256x256.png
          sips -z 512 512   assets/app.png --out app.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/app.png --out app.iconset/icon_512x512.png
          sips -z 1024 1024 assets/app.png --out app.iconset/icon_512x512@2x.png
          iconutil -c icns app.iconset -o assets/app.icns
          echo "icns ready: $(ls -la assets/app.icns 2>/dev/null || echo MISSING)"
      - name: Build with PyInstaller
        run: pyinstaller manggo-pro-client.spec
      - name: Pack
        run: |
          cd dist && zip -r -y ../ManggoProClient-macOS-AppleSilicon.zip ManggoProClient.app
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-macOS-AppleSilicon
          path: ManggoProClient-macOS-AppleSilicon.zip
          retention-days: 30

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Build with PyInstaller
        run: pyinstaller manggo-pro-client.spec
      - name: Pack
        run: tar -czf ManggoProClient-Linux-x64.tar.gz -C dist ManggoProClient
      - uses: actions/upload-artifact@v4
        with:
          name: ManggoProClient-Linux-x64
          path: ManggoProClient-Linux-x64.tar.gz
          retention-days: 30
